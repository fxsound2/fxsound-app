name: Linux CI

on:
  push:
    branches: [linux, feature/linux-port]
  pull_request:
    branches: [linux, feature/linux-port, main]

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build setup
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config \
            pipewire-devel systemd-devel dbus-devel alsa-lib-devel \
            libX11-devel libXext-devel libXinerama-devel libXrandr-devel \
            libXcursor-devel libXcomposite-devel libXrender-devel \
            freetype-devel fontconfig-devel mesa-libGL-devel libcurl-devel \
            xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (Ninja)
        run: cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target FxSound -j$(nproc)
      - name: Smoke Test
        run: bash ./linux/tests/smoke_test.sh build/FxSound_artefacts/Release/FxSound

  windows-msvc:
    name: Build Shared Libraries (Windows MSVC)
    runs-on: windows-2022
    env:
      CL: /D_CRT_SECURE_NO_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build DfxDsp (Release x64)
        run: msbuild dsp\DfxDsp.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Build AudioPassthru (Release x64)
        run: msbuild audiopassthru\audiopassthru.vcxproj -p:Configuration=Release -p:Platform=x64
