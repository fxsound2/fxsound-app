name: Claude Code Review

on:
  pull_request_target:
    # 'labeled' lets a maintainer approve a review for an external PR.
    # 'synchronize' is intentionally omitted: fork pushes must not trigger runs with secrets.
    types: [opened, ready_for_review, labeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Trusted authors are reviewed automatically. PRs from anyone else run only
    # after a maintainer adds the 'safe-to-review' label.
    if: |
      github.event.pull_request.draft == false && (
        (github.event.action != 'labeled' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'safe-to-review')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level so only runs that pass the 'if' above join the group. At workflow
    # level, adding an unrelated label would cancel an in-progress review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # SECURITY: check out the trusted BASE branch (the pull_request_target default),
      # never the PR head. This job has access to secrets; untrusted PR files must not
      # be placed in the workspace. The review reads PR changes via the GitHub API.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
