name: Publish DSP tutorial

on:
  push:
    branches: [main]
    paths: ["web/dsp-tutorial/**"]   # only redeploy when the tutorial changes
  workflow_dispatch:                 # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dsp-tutorial/
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (page, css and js only; no tests or README)
        run: |
          mkdir -p _site/dsp-tutorial
          cp -r web/dsp-tutorial/index.html web/dsp-tutorial/css web/dsp-tutorial/js _site/dsp-tutorial/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
